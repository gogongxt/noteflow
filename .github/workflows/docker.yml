name: Docker

# Publishes the image on a version tag (git tag v0.2.0 && git push origin v0.2.0),
# or by hand from the Actions tab. ghcr.io needs nothing but this file; Docker Hub
# additionally needs DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets,
# and is skipped while they are absent.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      HAS_HUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
      HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.HAS_HUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          ref="${GITHUB_REF_NAME#v}"
          repo="ghcr.io/${GITHUB_REPOSITORY}"
          tags="${repo}:${ref},${repo}:latest"
          if [ "$HAS_HUB" = "true" ]; then
            tags="${tags},${HUB_USER}/noteflow:${ref},${HUB_USER}/noteflow:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # arm64 covers Apple Silicon and arm servers; buildx emulates it on
          # the amd64 runner.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
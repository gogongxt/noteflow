# noteflow: mount your notes, get a served site on http://localhost:8080.
#
#   docker compose up --build
#
# Compose builds the image only when it does not exist yet; pass --build to
# rebuild after the project's own files changed.
services:
  noteflow:
    build: .
    image: ghcr.io/gogongxt/noteflow:latest
    ports:
      # Plain http, no TLS or rate limits — fine for a local preview. On a
      # public host put a TLS proxy in front and publish loopback only:
      # - "127.0.0.1:8080:8080"
      - "8080:8080"
    volumes:
      # Mode 1 — bind mount: a notes checkout you keep on the host. Writable on
      # purpose: a note's abbrlink is written into its frontmatter on its first
      # build. Updates happen on the host; restart the container to rebuild.
      - ./notes:/app/notes:rw
      # Mode 2 — sync, mutually exclusive with the bind mount above: comment
      # the rw line out. The container clones the repository itself and keeps
      # it current on a named volume — declare it at the bottom of this file
      # (optional: without it every container recreate re-clones).
      # - notes-store:/app/notes
      # The mounted config must carry the sync block: it has to be readable
      # BEFORE the first clone, so a copy inside the notes tree cannot
      # bootstrap its own clone. Give the remote push access — the container
      # commits new notes' abbrlinks back — either as a token in the https
      # remote URL (then no key mount is needed) or as an ssh key:
      # - ./site.config.local.mjs:/app/site.config.local.mjs:ro
      # - ~/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
      # Optional: run from a source tree instead of the image's code (a fork,
      # or a checkout newer than the tag). node_modules is installed on start
      # when this mount hides the image's own.
      # - .:/app:ro
    environment:
      # A named site.config.* profile instead of site.config.mjs, e.g.
      # site.config.docs.mjs. Mount it in /app and make sure its contentDir is
      # the directory mounted here.
      # CONFIG: site.config.docs.mjs
      PORT: "8080"
    restart: unless-stopped

# volumes:
#   notes-store: {}
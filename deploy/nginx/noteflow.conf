# example.com · static site (reference config for a noteflow deployment)
# Layout: /srv/noteflow/releases/<buildId>/ + /srv/noteflow/current symlink
# (atomic switch via ln -sfn + mv -T). Security headers live in
# snippets/security-headers.conf (add_header is not inherited; every location
# must include it explicitly).
#
# The *_zone directives are valid only in the http{} context, so they live in
# snippets/rate-limit-zones.conf: include that file from http{}, right above
# the server blocks that include this one.

server {
    listen 443 ssl;
    http2 on;                       # nginx >= 1.25.1; on 1.24 use "listen 443 ssl http2;"
    server_name example.com;

    root /srv/noteflow/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/json
               image/svg+xml application/javascript text/javascript application/rss+xml;

    # Zone definitions live in snippets/rate-limit-zones.conf (http{} context).
    limit_req zone=site burst=40 nodelay;
    limit_conn conn 20;
    limit_req_status 429;
    limit_conn_status 429;

    include snippets/security-headers.conf;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Hidden files (.git, .env, ...) are inaccessible
    location ~ /\. {
        deny all;
        include snippets/security-headers.conf;
    }

    # Source files never leak (robots.txt / feed.xml are allowed separately below)
    location ~* \.(md|markdown|txt|yml|yaml|toml|ini|conf|bak|swp)$ {
        deny all;
        include snippets/security-headers.conf;
    }

    location = /robots.txt {
        include snippets/security-headers.conf;
    }

    location = /feed.xml {
        types { }
        default_type application/rss+xml;
        add_header Cache-Control "no-cache" always;
        include snippets/security-headers.conf;
    }

    # Attachments are content-addressed (assets/<abbrlink>/<name>.<hash>.<ext>),
    # same trust level as /static/; cache forever. `types` replaces the inherited
    # map here, so it must list every attachment type: Safari refuses to play
    # media served as octet-stream, and a distro mime.types may lack wav/vtt/m4a.
    # tests/build.test.ts pins this table to src/render/attachments.ts.
    location /assets/ {
        try_files $uri =404;
        types {
            image/png            png;
            image/jpeg           jpg jpeg;
            image/gif            gif;
            image/webp           webp;
            image/avif           avif;
            image/svg+xml        svg;
            image/x-icon         ico;
            image/bmp            bmp;
            font/woff            woff;
            font/woff2           woff2;
            font/ttf             ttf;
            font/otf             otf;
            application/pdf      pdf;
            audio/mpeg           mp3;
            audio/mp4            m4a;
            audio/ogg            ogg oga;
            audio/wav            wav;
            audio/flac           flac;
            video/mp4            mp4;
            video/webm           webm;
            video/ogg            ogv;
            text/vtt             vtt;
        }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/security-headers.conf;
    }

    # Theme static assets: the URL embeds the content hash
    # (/static/<name>.<hash>.<ext>), so they can be cached forever. Fonts must be
    # covered here: once their cache expires they re-download, and
    # font-display: swap makes the whole page fall back and swap back — the
    # header and sidebar visibly "jitter" together.
    location /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/security-headers.conf;
    }

    # Old note URLs are /posts/<abbrlink>.html; notes are now directories
    # (/posts/<abbrlink>/). Redirect permanently to keep external references and
    # existing discussions. Matches the 301 behavior in src/serve.ts.
    location ~ ^/posts/([^/]+)\.html$ {
        return 301 /posts/$1;
        include snippets/security-headers.conf;
    }

    # Directory-style URL without a trailing slash → 301 to add it (matches src/serve.ts)
    location / {
        # Note: an internal redirect through $uri/ does not pass the .md/.txt
        # deny rules again, so $uri/ is not used here; instead every directory
        # must contain an index.html.
        try_files $uri $uri/index.html =404;
        # Release directories are named by buildId, not content hash; HTML must always revalidate
        add_header Cache-Control "no-cache" always;
        include snippets/security-headers.conf;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include snippets/security-headers.conf;
    }

    autoindex off;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

# Rate-limit zone definitions for the site.
# The *_zone directives are valid only in the http{} context, while
# noteflow.conf is included per server block — so the zones are defined
# here and this file must be included from http{} exactly once, right above
# the server blocks:
#
#     include /etc/nginx/snippets/rate-limit-zones.conf;
#     include /etc/nginx/sites-enabled/noteflow.conf;
#
# A second include of this file is an error ("zone site is already bound");
# nginx -t catches it, as it catches the missing zone when this file is
# skipped.

limit_req_zone $binary_remote_addr zone=site:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;

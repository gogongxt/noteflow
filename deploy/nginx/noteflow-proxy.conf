# example.com · TLS reverse proxy in front of the noteflow container
#
# The container (ghcr.io/gogongxt/noteflow) serves plain http; publish it on
# the loopback interface only, so nothing but this proxy can reach it:
#   docker run -d -p 127.0.0.1:8080:8080 …
#
# The container sends the site's CSP and cache policy itself — production's
# set, minus upgrade-insecure-requests, which only makes sense behind TLS and
# is covered here by HSTS. This proxy adds exactly those two pieces plus the
# rate limits. Do NOT add a second Content-Security-Policy header here:
# browsers enforce every CSP header they receive, so a stale extra policy
# would block the site's hashed inline scripts and styles.
#
# The *_zone directives are valid only in the http{} context: include
# snippets/rate-limit-zones.conf from http{}, right above the server blocks
# that include this one (same as with noteflow.conf).

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;                       # nginx >= 1.25.1; on 1.24 use "listen 443 ssl http2;"
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # The container serves uncompressed; gzip here before the bytes hit the wire.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/json
               image/svg+xml application/javascript text/javascript application/rss+xml;

    # Zone definitions live in snippets/rate-limit-zones.conf (http{} context).
    # $remote_addr at this edge is the real client — the container is upstream.
    limit_req zone=site burst=40 nodelay;
    limit_conn conn 20;
    limit_req_status 429;
    limit_conn_status 429;

    # The one security header the container cannot send (it is plain http).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Range seeks in <video> should stream, not buffer through a temp file.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
